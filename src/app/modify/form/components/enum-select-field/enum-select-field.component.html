<div class="enum-select-field field-with-tooltip" style="position: relative">
	<app-field-debug-overlay
		[label]="label"
		[fieldName]="fieldName || ''"
		[required]="required"
		[validationInfo]="getValidationDebugInfo()"
	></app-field-debug-overlay>
	<mat-form-field class="ob-w-full">
		<mat-label>
			{{ label | translate }}
			<span *ngIf="recommended && !required" class="recommended-indicator">{{ "modify.auth.form.validation.recommended" | translate }}</span>
		</mat-label>

		<mat-select [formControl]="control" [placeholder]="placeholder | translate" (blur)="onBlur()">
			<mat-option *ngFor="let option of filteredOptions" [value]="option">
				{{ getOptionTranslationKey(option) | translate }}
			</mat-option>
		</mat-select>

		<mat-error *ngIf="hasError('required')">
			{{ getErrorMessage() | translate }}
		</mat-error>
	</mat-form-field>
	<app-form-field-tooltip [fieldName]="fieldName || label.replace('labels.', '')"></app-form-field-tooltip>
</div>
