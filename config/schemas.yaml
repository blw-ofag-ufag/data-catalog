- id: ods
  name: Open Data Swiss Requirements
  githubRepo: blw-ofag-ufag/metadata
  branch: main
  path: data/schema_strict/strict-ods-dataset.json
  color: '#e91e63'
  alertType: warning
  icon: checkmark-circle