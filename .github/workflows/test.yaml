name: Tests

on:
    pull_request:
    push:
        branches:
            - develop

jobs:
    unit:
        name: Unit & component (Jest)
        runs-on: ubuntu-latest
        # The #259 date-only regression is only observable on a clock east of UTC — the
        # actual audience. It must be set here, before Node starts: assigning process.env.TZ
        # from inside a spec does not reach Node's timezone setter under jsdom.
        env:
            TZ: Europe/Zurich
        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v4
            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: npm
            -   name: Install Dependencies
                run: npm install
            -   name: Generate config/schema JSON
                run: npm run prebuild
            # src/app/codegen/ is generated from the YAML in config/ but committed so that a
            # fresh clone can `ng serve` without a prebuild. That only holds while the two
            # stay in step, which nothing enforced until now.
            -   name: Check committed codegen and VERSION.txt are up to date
                run: git diff --exit-code -- src/app/codegen src/assets/VERSION.txt
            -   name: Run Jest
                run: npm run test:ci
            # Blocking: a key missing in one language renders the raw translation key in the
            # UI. fr and it had drifted 37 keys behind de before this check existed.
            -   name: Check i18n catalogs are in sync
                run: npm run check:i18n
            # Reports when src/app/models/schemas/dataset.ts falls behind the runtime-fetched
            # schema. It currently FAILS on purpose: three fields the schema dropped are still
            # declared, and 23 published records still carry one of them (issue #284). Kept
            # non-blocking until that data question is settled, then drop continue-on-error so
            # the next drift is caught rather than merely noted.
            -   name: Check schema drift (non-blocking, see #284)
                run: npm run check:schema-drift
                continue-on-error: true
            -   name: Upload coverage
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: coverage
                    path: coverage/
                    if-no-files-found: ignore

    # E2E was previously not run in CI because the local sandbox could not install
    # Playwright's browser dependencies (libnspr4 needs root). That constraint does not
    # apply to ubuntu-latest, where `playwright install --with-deps` just works, and the
    # suite is fully mocked (e2e/support/mock-api.ts), so it needs no network.
    #
    # continue-on-error while the job proves itself over a few runs. Once it has been
    # green consistently, drop it so a broken workflow actually blocks a merge.
    e2e:
        name: E2E (Playwright)
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v4
            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: npm
            -   name: Install Dependencies
                run: npm install
            -   name: Generate config/schema JSON
                run: npm run prebuild
            -   name: Install Playwright browser
                run: npx playwright install --with-deps chromium
            -   name: Run Playwright
                run: npm run test:e2e
            -   name: Upload report
                if: failure()
                uses: actions/upload-artifact@v4
                with:
                    name: playwright-report
                    path: playwright-report/
                    if-no-files-found: ignore
