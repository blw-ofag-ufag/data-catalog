name: Build and Deploy Script
on:
    push:
        branches:
            - develop

# Only the newest commit needs to reach GitHub Pages; superseded runs can be dropped.
# (Until Azure was abandoned this had to be cancel-in-progress: false, because the job
# also pushed a build back to develop and two runs would race on that push.)
concurrency:
    group: deploy-develop
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v4
            -   name: Adding Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: npm
            -   name: Install Dependencies
                run: npm install
            -   name: Build Angular App
                run: |
                    npm run prebuild
                    npm run build:pages -- --output-path=dist/gh-pages
            -   name: Deploy to gh-pages
                run: npx angular-cli-ghpages --dir=dist/gh-pages
                env:
                    CI: true
                    GH_TOKEN: ${{ secrets.GH_TOKEN }}
